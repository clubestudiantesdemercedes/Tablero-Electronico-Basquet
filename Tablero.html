<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tablero público | CAE</title><link rel="stylesheet" href="estilo.css"></head><body class="public-board"><main class="board-shell"><div class="board-head">CLUB ATLÉTICO ESTUDIANTES · BÁSQUET</div><div class="board-main"><section class="board-team"><h2 id="homeName">LOCAL</h2><div class="board-score" id="homeScore">0</div><div class="board-fouls">FALTAS <b id="homeFouls">0</b></div></section><section class="board-clock"><div class="period" id="period">CUARTO 1</div><div class="time" id="clock">10:00</div><div class="board-fouls" id="clockStatus">RELOJ DETENIDO</div></section><section class="board-team"><h2 id="awayName">VISITA</h2><div class="board-score" id="awayScore">0</div><div class="board-fouls">FALTAS <b id="awayFouls">0</b></div></section></div><div class="board-footer" id="footer">TABLERO ELECTRÓNICO · ESTUDIANTES</div></main><script>const K="cae-scoreboard-v2";function f(n){n=Math.max(0,Math.floor(n||0));return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}function render(){try{const s=JSON.parse(localStorage.getItem(K));if(!s)return;for(const [id,v] of Object.entries({homeName:s.homeName,awayName:s.awayName,homeScore:s.home.score,awayScore:s.away.score,homeFouls:s.home.fouls,awayFouls:s.away.fouls,period:s.kind==="OT"?"SUPLEMENTARIO "+s.ot:"CUARTO "+s.period,clock:f(s.remaining),clockStatus:s.running?"RELOJ EN MARCHA":s.status==="finished"?"PARTIDO FINALIZADO":"RELOJ DETENIDO",footer:(s.venue?s.venue+" · ":"")+"TABLERO ELECTRÓNICO · ESTUDIANTES"})){const e=document.getElementById(id);if(e)e.textContent=v??""}}catch(e){}}addEventListener("storage",render);setInterval(render,250);render();</script></body></html>
